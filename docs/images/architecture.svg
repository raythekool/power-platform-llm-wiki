<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <title id="title">From sources to a governed, queryable wiki</title>
    <desc id="desc">Code repositories, platform metadata, Azure DevOps Boards and documents are processed by the LLM Wiki engine into a wiki that is published to Azure DevOps Wiki, GitHub Wiki, Copilot and VS Code.</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
        </marker>
    </defs>
    <rect x="1" y="1" width="1198" height="538" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    <text x="600" y="44" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">From sources to a governed, queryable wiki</text>

    <g font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">
        <text x="160" y="84">1 · SOURCES</text>
        <text x="475" y="84">2 · ENGINE</text>
        <text x="780" y="84">3 · WIKI</text>
        <text x="1055" y="84">4 · CONSUMERS</text>
    </g>

    <!-- sources -->
    <g>
        <rect x="30" y="100" width="260" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="44" y="122" width="40" height="40" rx="10" fill="#6366F1"/>
        <text x="64" y="148" font-size="13" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
        <text x="96" y="138" font-size="17" font-weight="700" fill="#0F172A">Code repositories</text>
        <text x="96" y="159" font-size="12" fill="#64748B">Azure Repos · GitHub · local</text>

        <rect x="30" y="198" width="260" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="44" y="220" width="40" height="40" rx="10" fill="#0EA5E9"/>
        <text x="64" y="246" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">DB</text>
        <text x="96" y="236" font-size="17" font-weight="700" fill="#0F172A">Platform metadata</text>
        <text x="96" y="257" font-size="12" fill="#64748B">Dataverse · F&amp;O Ax* objects</text>

        <rect x="30" y="296" width="260" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="44" y="318" width="40" height="40" rx="10" fill="#14B8A6"/>
        <text x="64" y="344" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">WI</text>
        <text x="96" y="334" font-size="17" font-weight="700" fill="#0F172A">Azure DevOps Boards</text>
        <text x="96" y="355" font-size="12" fill="#64748B">Features · stories · bugs</text>

        <rect x="30" y="394" width="260" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="44" y="416" width="40" height="40" rx="10" fill="#F59E0B"/>
        <text x="64" y="441" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">DOC</text>
        <text x="96" y="432" font-size="17" font-weight="700" fill="#0F172A">Documents &amp; meetings</text>
        <text x="96" y="453" font-size="12" fill="#64748B">FDD · TDD · ADR · minutes</text>
    </g>

    <!-- connectors sources -> engine -->
    <g stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round">
        <line x1="290" y1="142" x2="310" y2="142"/>
        <line x1="290" y1="240" x2="310" y2="240"/>
        <line x1="290" y1="338" x2="310" y2="338"/>
        <line x1="290" y1="436" x2="310" y2="436"/>
        <line x1="310" y1="142" x2="310" y2="436"/>
        <line x1="310" y1="289" x2="326" y2="289" stroke="#64748B" marker-end="url(#arrow)"/>
    </g>

    <!-- engine -->
    <rect x="330" y="100" width="290" height="378" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
    <text x="346" y="130" font-size="17" font-weight="700" fill="#3730A3">llm-wiki/.engine</text>
    <text x="346" y="158" font-size="11" font-weight="700" fill="#4F46E5" letter-spacing="1">DETERMINISTIC SCRIPTS · NO TOKENS</text>
    <g font-size="12" fill="#1E293B" text-anchor="middle">
        <rect x="346" y="168" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="408" y="188">Code inventory</text>
        <rect x="480" y="168" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="542" y="188">Raw delta</text>
        <rect x="346" y="206" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="408" y="226">Wiki lint</text>
        <rect x="480" y="206" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="542" y="226">Export wiki</text>
    </g>
    <text x="346" y="270" font-size="11" font-weight="700" fill="#4F46E5" letter-spacing="1">SKILLS · THE AGENT</text>
    <g font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        <rect x="346" y="282" width="80" height="30" rx="15" fill="#6366F1"/>
        <text x="386" y="302">init</text>
        <rect x="436" y="282" width="80" height="30" rx="15" fill="#6366F1"/>
        <text x="476" y="302">config</text>
        <rect x="526" y="282" width="78" height="30" rx="15" fill="#6366F1"/>
        <text x="565" y="302">update</text>
        <rect x="346" y="320" width="80" height="30" rx="15" fill="#6366F1"/>
        <text x="386" y="340">ingest</text>
        <rect x="436" y="320" width="80" height="30" rx="15" fill="#6366F1"/>
        <text x="476" y="340">query</text>
    </g>
    <text x="346" y="384" font-size="11" font-weight="700" fill="#4F46E5" letter-spacing="1">RULES</text>
    <g font-size="12" fill="#1E293B" text-anchor="middle">
        <rect x="346" y="392" width="258" height="30" rx="15" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="475" y="412">AGENTS.md operating manual</text>
        <rect x="346" y="430" width="258" height="30" rx="15" fill="#FFFFFF" stroke="#C7D2FE"/>
        <text x="475" y="450">Templates · profiles (CE · F&amp;O)</text>
    </g>

    <line x1="620" y1="289" x2="656" y2="289" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- wiki -->
    <rect x="660" y="100" width="240" height="378" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
    <text x="676" y="130" font-size="17" font-weight="700" fill="#065F46">llm-wiki/wiki</text>
    <g font-size="14" font-family="Consolas, Menlo, monospace" fill="#064E3B">
        <circle cx="684" cy="162" r="5" fill="#10B981"/>
        <text x="700" y="167">requirements/</text>
        <circle cx="684" cy="202" r="5" fill="#10B981"/>
        <text x="700" y="207">design/</text>
        <circle cx="684" cy="242" r="5" fill="#10B981"/>
        <text x="700" y="247">code/</text>
        <circle cx="684" cy="282" r="5" fill="#10B981"/>
        <text x="700" y="287">features/</text>
        <circle cx="684" cy="322" r="5" fill="#10B981"/>
        <text x="700" y="327">meetings/</text>
        <circle cx="684" cy="362" r="5" fill="#10B981"/>
        <text x="700" y="367">reference/</text>
        <circle cx="684" cy="402" r="5" fill="#10B981"/>
        <text x="700" y="407">index · log</text>
    </g>
    <text x="676" y="436" font-size="11" font-weight="700" fill="#047857" letter-spacing="1">LIFECYCLE</text>
    <g font-size="11" font-weight="700" text-anchor="middle">
        <rect x="676" y="442" width="62" height="26" rx="13" fill="#FEF3C7"/>
        <text x="707" y="459" fill="#92400E">draft</text>
        <rect x="744" y="442" width="62" height="26" rx="13" fill="#E0F2FE"/>
        <text x="775" y="459" fill="#075985">reviewed</text>
        <rect x="812" y="442" width="62" height="26" rx="13" fill="#DCFCE7"/>
        <text x="843" y="459" fill="#166534">certified</text>
    </g>

    <!-- connectors wiki -> consumers -->
    <g stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round">
        <line x1="900" y1="289" x2="920" y2="289"/>
        <line x1="920" y1="142" x2="920" y2="436"/>
        <line x1="920" y1="142" x2="936" y2="142" stroke="#64748B" marker-end="url(#arrow)"/>
        <line x1="920" y1="240" x2="936" y2="240" stroke="#64748B" marker-end="url(#arrow)"/>
        <line x1="920" y1="338" x2="936" y2="338" stroke="#64748B" marker-end="url(#arrow)"/>
        <line x1="920" y1="436" x2="936" y2="436" stroke="#64748B" marker-end="url(#arrow)"/>
    </g>

    <!-- consumers -->
    <g>
        <rect x="940" y="100" width="230" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="952" y="122" width="40" height="40" rx="10" fill="#0EA5E9"/>
        <text x="972" y="147" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ADO</text>
        <text x="1004" y="138" font-size="16" font-weight="700" fill="#0F172A">Azure DevOps Wiki</text>
        <text x="1004" y="159" font-size="12" fill="#64748B">project or code wiki</text>

        <rect x="940" y="198" width="230" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="952" y="220" width="40" height="40" rx="10" fill="#334155"/>
        <text x="972" y="245" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">GH</text>
        <text x="1004" y="236" font-size="16" font-weight="700" fill="#0F172A">GitHub Wiki</text>
        <text x="1004" y="257" font-size="12" fill="#64748B">sidebar + flat pages</text>

        <rect x="940" y="296" width="230" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="952" y="318" width="40" height="40" rx="10" fill="#8B5CF6"/>
        <text x="972" y="343" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI</text>
        <text x="1004" y="334" font-size="16" font-weight="700" fill="#0F172A">Copilot Studio</text>
        <text x="1004" y="355" font-size="12" fill="#64748B">ask the wiki in chat</text>

        <rect x="940" y="394" width="230" height="84" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="952" y="416" width="40" height="40" rx="10" fill="#2563EB"/>
        <text x="972" y="441" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">VS</text>
        <text x="1004" y="432" font-size="16" font-weight="700" fill="#0F172A">VS Code agent</text>
        <text x="1004" y="453" font-size="12" fill="#64748B">query with citations</text>
    </g>

    <text x="600" y="518" font-size="13" fill="#64748B" text-anchor="middle">Markdown is the single source; each target gets its own converted copy.</text>
</svg>
