<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <title id="title">LLM Wiki</title>
    <desc id="desc">Code, metadata, documents and meetings flow into a governed wiki that is published to Azure DevOps Wiki or GitHub Wiki.</desc>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0B1220"/>
            <stop offset="0.6" stop-color="#1E1B4B"/>
            <stop offset="1" stop-color="#5B21B6"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#A78BFA"/>
        </linearGradient>
    </defs>
    <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
    <circle cx="1090" cy="30" r="170" fill="#7C3AED" opacity="0.18"/>
    <circle cx="620" cy="330" r="120" fill="#22D3EE" opacity="0.10"/>

    <text x="64" y="140" font-size="68" font-weight="700" fill="#FFFFFF">LLM Wiki</text>
    <rect x="66" y="158" width="132" height="6" rx="3" fill="url(#accent)"/>
    <text x="64" y="206" font-size="25" fill="#E2E8F0">Code-first knowledge base for Dynamics 365 delivery</text>

    <g font-size="15" fill="#FFFFFF" text-anchor="middle">
        <rect x="64" y="236" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.25"/>
        <text x="139" y="258">Power Platform</text>
        <rect x="226" y="236" width="190" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.25"/>
        <text x="321" y="258">Finance &amp; Operations</text>
        <rect x="428" y="236" width="180" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.25"/>
        <text x="518" y="258">Azure DevOps Wiki</text>
    </g>

    <!-- code -->
    <rect x="712" y="104" width="108" height="128" rx="18" fill="#0F172A" fill-opacity="0.7" stroke="#22D3EE" stroke-width="2"/>
    <text x="766" y="166" font-size="38" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#22D3EE" text-anchor="middle">&lt;/&gt;</text>
    <text x="766" y="198" font-size="16" fill="#E2E8F0" text-anchor="middle">Code</text>
    <text x="766" y="218" font-size="12" fill="#94A3B8" text-anchor="middle">FDD · minutes</text>

    <line x1="826" y1="168" x2="852" y2="168" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="852,160 864,168 852,176" fill="#94A3B8"/>

    <!-- wiki page -->
    <rect x="868" y="76" width="140" height="184" rx="18" fill="#F8FAFC"/>
    <rect x="868" y="76" width="140" height="40" rx="18" fill="url(#accent)"/>
    <rect x="868" y="98" width="140" height="18" fill="url(#accent)"/>
    <text x="938" y="103" font-size="18" font-weight="700" fill="#0B1220" text-anchor="middle">Wiki</text>
    <rect x="884" y="134" width="108" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="884" y="150" width="84" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="884" y="166" width="100" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="884" y="188" width="38" height="24" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <rect x="954" y="188" width="38" height="24" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <line x1="922" y1="200" x2="954" y2="200" stroke="#6366F1" stroke-width="2"/>
    <rect x="884" y="226" width="84" height="22" rx="11" fill="#DCFCE7"/>
    <text x="926" y="241" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">certified</text>

    <line x1="1014" y1="168" x2="1042" y2="168" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="1042,160 1054,168 1042,176" fill="#94A3B8"/>

    <!-- publish -->
    <rect x="1056" y="104" width="100" height="128" rx="18" fill="#0F172A" fill-opacity="0.7" stroke="#A78BFA" stroke-width="2"/>
    <g fill="none" stroke="#A78BFA" stroke-width="3">
        <circle cx="1106" cy="150" r="28"/>
        <ellipse cx="1106" cy="150" rx="11" ry="28"/>
        <line x1="1078" y1="150" x2="1134" y2="150"/>
    </g>
    <text x="1106" y="204" font-size="14" fill="#E2E8F0" text-anchor="middle">Publish</text>
    <text x="1106" y="222" font-size="11" fill="#94A3B8" text-anchor="middle">ADO · GitHub</text>
</svg>
