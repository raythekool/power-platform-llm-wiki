# llm-wiki/wiki.config.yml - what the LLM Wiki tracks and how it publishes.
# Owned by the project team. Secrets never go here (use Git Credential Manager, `az login`,
# `pacx auth`, or CI secrets).

schema_version: 3

project:
  name: "" # shown in published wiki headers
  language: it # language of wiki content (it | en | ...)
  profiles: [power-platform] # power-platform | dynamics-fno | generic (one or more)

# Source code is the primary source for as-built documentation.
code:
  repos: []
  # - name: crm-solution
  #   provider: azure-devops        # azure-devops | github | local
  #   url: https://dev.azure.com/contoso/Sales/_git/crm-solution
  #   path: ../crm-solution          # local clone used for analysis (cloned/pulled by `update --source code`)
  #   branch: develop
  #   include: ["src/**", "solution/**"]
  #   exclude: ["**/tests/**"]

# Azure DevOps work items (Boards). Authentication: Microsoft Entra ID via the MCP server - no PAT.
devops:
  enabled: false
  organization: ""
  project: ""
  area_paths: [] # empty = all
  iteration_prefix: "" # e.g. "Sales\\2026"
  work_item_types: [Epic, Feature, User Story, Bug]
  excluded_states: [Removed]

# Dataverse (Power Platform) live metadata, via the active pacx/pac profile.
dataverse:
  enabled: false
  solutions: [] # unique names
  publisher_prefixes: [] # e.g. [cts_]

# Dynamics 365 Finance & Operations metadata (custom packages only).
fno:
  enabled: false
  metadata_paths: [] # e.g. ["../fno-repo/Metadata/ContosoExt"]
  models: [] # optional filter on model names

# GitHub activity (PRs, issues, branches) for repositories hosted on GitHub.
github:
  enabled: false
  repos: [] # owner/repo
  branch_patterns: ["^main$", "^develop$", "^release/", "^feature/"]

sharepoint:
  enabled: false
  site_url: ""
  document_libraries: []

sprints:
  duration_weeks: 2
  pattern: "YYYY-SNN"

governance:
  pii_redaction: true # keep only participant names/roles; never copy personal data
  stale_after_days: 30 # lint threshold for pages not updated
  certifiers: [] # people allowed to certify pages (informative)

# Project-specific rules the agent must follow (free text, one per line).
conventions: []

publish:
  enabled: false
  headless: false # allow scheduled runs to push to the wiki
  exclude: ["log.md", "lint-*.md"]
  target:
    type: azure-devops-wiki # azure-devops-wiki | github-wiki
    # Azure DevOps project wiki:  https://dev.azure.com/<organization>/<project>/_git/<wiki_name>.wiki (branch wikiMaster)
    organization: ""
    project: ""
    wiki_type: project # project | code
    wiki_name: "" # project wiki: "<Project>.wiki" name without the suffix
    repo: "" # code wiki: Azure Repos repo; github-wiki: owner/repo
    branch: "" # code wiki branch
    path: "" # code wiki folder
    mount_folder: "" # optional parent page, e.g. "Knowledge Base"

automation:
  enabled: false # GitHub-hosted host repos only (Copilot coding agent)
  schedule: weekly # daily | weekly | manual
